<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1, user-scalable=no: disables native pinch-zoom.
         Without this, mobile Safari/Chrome's zoom scale doesn't reliably
         reset across an orientation change, leaving the whole app
         rendered oversized until a manual (and imprecise) pinch back
         out. The one place zoom is genuinely useful — the plans PDF
         viewer — already implements its own pinch-to-zoom independent
         of native browser zoom (see PlanReader.tsx's touch handlers),
         so this doesn't remove any real functionality. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BenchLog</title>
    <meta name="description" content="Track your build project — log sessions, visualize progress, document your journey." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BenchLog" />
    <meta name="theme-color" content="#0b1326" />
    <!-- Material Symbols are self-hosted via the `material-symbols` npm
         package — see src/index.css. No external font requests. -->
    <style>
      /* Prevent FOUC: hide until React mounts */
      #root:empty { display: none }
      body { background: #09090b; margin: 0; overflow-x: hidden }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
